# Proposal for the market-agri pipeline (Java 21 + Maven). To run it, copy it to .github/workflows/.
name: security

on:
  pull_request:
    branches: [main, develop, qa]

permissions:
  contents: read

env:
  MODULE: 13-week/workshop/04-security-ci/transactions-authz

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: OWASP dependency-check (fail on CVSS >= 7)
        working-directory: ${{ env.MODULE }}
        run: mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7

  authz-tests:
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Negative authorization tests (E-44 admin route)
        working-directory: ${{ env.MODULE }}
        run: mvn -B test -Dtest=AdminTransactionsAuthzTest
